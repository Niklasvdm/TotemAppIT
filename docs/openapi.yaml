openapi: 3.1.0
info:
  title: Totem Finder API
  version: "1.3.0"
  description: >
    Read API for the totem catalogue (animals, traits, similarity, images, emoji),
    two hardened public write endpoints for community feedback (new-animal
    suggestions and reports on existing animals), and the multiplayer game
    transport (create a room over HTTP, then play over a WebSocket). All read
    endpoints are unauthenticated and idempotent. Admin review of feedback is out
    of band via the `totem-admin` CLI, so there is no admin HTTP surface.
  contact:
    name: Niklas
servers:
  - url: https://totem.nvdm.eu
    description: Production
  - url: https://dev.totem.nvdm.eu
    description: Dev
  - url: http://127.0.0.1:8683
    description: Local

tags:
  - name: catalogue
  - name: feedback
  - name: games
    description: >
      Create a room over HTTP, then play over the WebSocket. The post-handshake
      message bodies are game-specific and deliberately NOT modelled here (OpenAPI
      does not describe WebSocket payloads well); the socket and its frames are
      described in `docs/asyncapi.yaml`, and their authoritative shapes live in
      `src/internal/game/protocol.go` (per game) and `src/web/src/games/types.ts`.
      Known non-gaps: "local multiplayer" is a pure client behaviour (one device
      opens several WebSockets, one per local player) and needs no API surface; the
      `welcome` frame's game-specific `extra` payload is likewise documented in the
      protocol sources.

paths:
  /healthz:
    get:
      summary: Liveness probe
      operationId: health
      responses:
        "200":
          description: Service is up
          content:
            text/plain:
              schema: { type: string, example: ok }

  /api/v1/animals:
    get:
      tags: [catalogue]
      summary: List / filter animals
      description: >
        Lists animals ordered by name. With `include`/`exclude` trait filters it
        applies AND-across / OR-within-group semantics. `q` is a literal name
        substring match (LIKE metacharacters are escaped).
      operationId: listAnimals
      parameters:
        - $ref: "#/components/parameters/Lang"
        - name: q
          in: query
          description: Name substring filter (literal; `%` and `_` are not wildcards).
          schema: { type: string, maxLength: 100 }
        - name: include
          in: query
          description: Comma-separated trait group keys the animal must all have (OR within a `|`-group).
          schema: { type: string, example: "bouwlustig,moedig|dapper" }
        - name: exclude
          in: query
          description: Comma-separated trait group keys the animal must not have.
          schema: { type: string }
      responses:
        "200":
          description: Matching animals
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Animal" }
        "500": { $ref: "#/components/responses/ServerError" }

  /api/v1/animals/{slug}:
    get:
      tags: [catalogue]
      summary: Get one animal (full detail)
      operationId: getAnimal
      parameters:
        - $ref: "#/components/parameters/Slug"
        - $ref: "#/components/parameters/Lang"
      responses:
        "200":
          description: Animal detail
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AnimalDetail" }
        "404": { $ref: "#/components/responses/NotFound" }
        "500": { $ref: "#/components/responses/ServerError" }

  /api/v1/animals/{slug}/similar:
    get:
      tags: [catalogue]
      summary: Animals similar to this one
      description: Ranks other animals by Jaccard overlap of trait sets.
      operationId: similarToAnimal
      parameters:
        - $ref: "#/components/parameters/Slug"
        - $ref: "#/components/parameters/Lang"
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 50, default: 10 }
      responses:
        "200":
          description: Ranked animals (each with a `score`)
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Animal" }
        "500": { $ref: "#/components/responses/ServerError" }

  /api/v1/similar:
    get:
      tags: [catalogue]
      summary: Animals similar to a trait profile
      description: Ranks animals by Jaccard overlap with the selected include/exclude trait profile.
      operationId: similarByTraits
      parameters:
        - $ref: "#/components/parameters/Lang"
        - name: include
          in: query
          schema: { type: string }
        - name: exclude
          in: query
          schema: { type: string }
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 500, default: 60 }
      responses:
        "200":
          description: Ranked animals (empty when `include` is empty)
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Animal" }
        "500": { $ref: "#/components/responses/ServerError" }

  /api/v1/animals/{slug}/image:
    get:
      tags: [catalogue]
      summary: Animal image
      operationId: animalImage
      parameters:
        - $ref: "#/components/parameters/Slug"
      responses:
        "200":
          description: The image
          headers:
            Cache-Control:
              schema: { type: string, example: "public, max-age=86400" }
          content:
            image/webp:
              schema: { type: string, format: binary }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/v1/traits:
    get:
      tags: [catalogue]
      summary: Trait cloud
      description: >
        Traits projected to `lang`, most-used first. Synonymous Dutch traits that
        share a translated label are grouped; `key` is the `|`-joined group.
      operationId: listTraits
      parameters:
        - $ref: "#/components/parameters/Lang"
      responses:
        "200":
          description: Traits
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Trait" }
        "500": { $ref: "#/components/responses/ServerError" }

  /api/v1/emoji:
    get:
      tags: [catalogue]
      summary: Slug → emoji map
      operationId: emojiMap
      responses:
        "200":
          description: Map of slug to a single emoji (empty object if unavailable)
          content:
            application/json:
              schema:
                type: object
                additionalProperties: { type: string }
                example: { wolf: "🐺", bever: "🦫" }

  /api/v1/suggestions:
    post:
      tags: [feedback]
      summary: Suggest a new animal
      description: >
        Submits a new-animal suggestion to the moderation queue. Deduplicated by
        a normalized name (case/whitespace-insensitive) with a running count, so
        repeat submissions bump the counter rather than creating duplicates.
        Rate limited to 10 requests/minute per IP. Body is capped at 4 KiB and
        validated strictly (unknown fields rejected).
      operationId: createSuggestion
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SuggestionRequest" }
      responses:
        "202":
          $ref: "#/components/responses/Received"
        "400": { $ref: "#/components/responses/BadRequest" }
        "429": { $ref: "#/components/responses/RateLimited" }
        "500": { $ref: "#/components/responses/ServerError" }

  /api/v1/animals/{slug}/reports:
    post:
      tags: [feedback]
      summary: Report an existing animal
      description: >
        Reports an animal (wrong, too obscure, poor description, …). Deduplicated
        per (animal, reason) with a running count. The slug must reference a real
        animal. Rate limited to 10 requests/minute per IP.
      operationId: createReport
      parameters:
        - $ref: "#/components/parameters/Slug"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ReportRequest" }
      responses:
        "202":
          $ref: "#/components/responses/Received"
        "400": { $ref: "#/components/responses/BadRequest" }
        "404": { $ref: "#/components/responses/NotFound" }
        "429": { $ref: "#/components/responses/RateLimited" }
        "500": { $ref: "#/components/responses/ServerError" }

  /api/v1/games/rooms:
    post:
      tags: [games]
      summary: Create a game room
      description: >
        Opens a new game room and returns its join code. The `game` query param
        picks which game (default `bomberman`). Creating a room allocates a
        server-side goroutine, so it is rate limited to 20 requests/minute per IP.
        Idle rooms are reaped automatically. No request body. Join the returned
        code over the WebSocket endpoint; the message protocol after the handshake
        is game-specific.
      operationId: createRoom
      parameters:
        - name: game
          in: query
          description: >
            Which game to host: a registered game slug. Currently bomberman,
            codenames, the-mind, the-game, wavelength, just-one, love-letter,
            decrypto, hanabi, skyjo, crawler. Validated against the registry; an
            unknown slug is refused with 400. (Listed here as examples, not an
            enum, so the contract does not drift each time a game is added.)
          schema:
            type: string
            default: bomberman
            example: crawler
      responses:
        "201":
          description: Room created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RoomCreated" }
        "400":
          description: Unknown game slug
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "429": { $ref: "#/components/responses/RateLimited" }
        "503":
          description: No free game rooms right now (server at capacity)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /api/v1/games/reports:
    post:
      tags: [games]
      summary: Report a problem with a game
      description: >
        Files a report about a game (a bug, a rules question, something unclear,
        or other). The `game` must be a registered slug (validated against the
        registry; an unknown game is refused with 400, NOT 404). Deduplicated per
        (game, reason) with a running count, like the animal reports. Rate limited
        to 10 requests/minute per IP. Admin review is out of band via the
        `totem-admin game-reports` CLI.
      operationId: createGameReport
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/GameReportRequest" }
      responses:
        "202":
          $ref: "#/components/responses/Received"
        "400":
          description: Malformed body, unknown game, invalid reason, or a bad note
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "429": { $ref: "#/components/responses/RateLimited" }
        "500": { $ref: "#/components/responses/ServerError" }

  /api/v1/games/ws:
    get:
      tags: [games]
      summary: Join a room (WebSocket)
      description: >
        Upgrades to a WebSocket for one player's session in a room. Not a REST
        call: on success the server replies `101 Switching Protocols` and then
        speaks the game protocol (JSON text frames). The `Origin` must match the
        server's `Host` (same-origin); extra origins are allowlisted server-side
        only for the dev proxy (`TOTEM_ALLOWED_ORIGINS`), empty in production.

        After the upgrade the server sends a `welcome` frame (your slot, the room's
        `game` slug, the tick rate, any game-specific `extra`, and a `token` to
        reclaim this seat after a drop; a reconnect with that token SUPERSEDES a still
        -connected stale socket and keeps the same seat and state), then `state` frames and `roster` frames on
        membership changes. How often `state` arrives depends on the game: the only
        realtime game (Bomberman) streams ~60x/second, while the turn-based games
        (Codenames, Hanabi, the Totem Crawler, …) are event-driven and push a
        `state` only when something changes. The client sends `start`/`restart`/`bye`
        plus that game's own command frames (Bomberman: a direction + a bomb flag;
        the turn games: play/guess/clue/lay/… as the game defines). Incoming frames
        are capped at 512 bytes by the socket read limit (`maxGameFrame`), with a
        further 8 KiB guard in the engine. The per-game command and view shapes are
        the authoritative contract and live in `src/internal/game/protocol.go` and
        `src/web/src/games/types.ts` (not modelled here; see the `games` tag note).
      operationId: gameWebSocket
      parameters:
        - name: code
          in: query
          required: true
          description: Room code (case-insensitive; normalised to upper case).
          schema: { type: string, pattern: "^[A-Za-z0-9]+$", example: K7QM }
        - name: name
          in: query
          required: true
          description: Player nickname (1–16 runes; letters/marks/digits, space and ' ’ . _ -).
          schema: { type: string, minLength: 1, maxLength: 16, example: Niklas }
        - name: animal
          in: query
          description: >
            The per-game "meta" channel (named `animal` for historical reasons): the
            player's totem slug for Bomberman and the Crawler, empty for games that
            need no per-player choice. An unrecognised value is dropped, not refused.
          schema: { type: string, pattern: "^[a-z0-9-]+$", example: bever }
        - name: resume
          in: query
          description: Seat-resume token from a previous `welcome`, to reclaim a dropped seat.
          schema: { type: string }
      responses:
        "101":
          description: >
            Switching protocols: the WebSocket is open. Validation that used to be a
            pre-upgrade HTTP 4xx now happens OVER the socket: the server accepts the
            upgrade and, if it must refuse, sends an `error` frame and closes with a
            WebSocket close code so the client can act on the reason:
              * **4404** (`wsCloseRoomGone`, the browser-readable 4000-4999 range) — unknown
                room code, or a room that closed mid-session. The client stops reconnecting,
                drops its stale resume token, and shows "This room is no longer available".
              * **1008** (policy violation) — invalid player name.
              * **1013** (try again later) — room full / unavailable.
            A plain network drop surfaces as **1006**; the client retries with full-jitter
            backoff for ~5 minutes (longer than the seat-hold grace) before giving up.
        "403":
          description: >
            Origin not allowed (cross-origin WebSocket refused). This one is still a
            pre-upgrade HTTP error, written by `websocket.Accept` before the handshake.

components:
  parameters:
    Lang:
      name: lang
      in: query
      description: UI language; anything else falls back to Italian.
      schema:
        type: string
        enum: [it, en, nl]
        default: it
    Slug:
      name: slug
      in: path
      required: true
      description: Lowercase animal slug.
      schema:
        type: string
        pattern: "^[a-z0-9-]+$"
        example: bever

  responses:
    Received:
      description: Accepted for review
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Received" }
    BadRequest:
      description: Validation failed
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    NotFound:
      description: Resource not found
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    RateLimited:
      description: Too many submissions
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    ServerError:
      description: Internal error
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }

  schemas:
    Animal:
      type: object
      required: [slug, name, description, traits]
      properties:
        slug: { type: string, example: bever }
        name: { type: string, example: Beaver }
        description: { type: string }
        traits:
          type: array
          items: { type: string }
        score:
          type: number
          format: double
          description: Jaccard similarity 0..1; present only on similarity results.
    AnimalDetail:
      type: object
      required: [slug, name, nameNl, description, traits]
      properties:
        slug: { type: string }
        name: { type: string, description: Name in the requested language }
        nameIt: { type: string }
        nameEn: { type: string }
        nameNl: { type: string, description: Canonical Dutch name }
        altNames: { type: string }
        description: { type: string }
        traits:
          type: array
          items: { type: string }
        sourceUrl: { type: string }
        image: { $ref: "#/components/schemas/Image" }
    Image:
      type: object
      required: [url]
      properties:
        url: { type: string, example: /api/v1/animals/bever/image }
        author: { type: string }
        license: { type: string }
        source: { type: string }
    Trait:
      type: object
      required: [key, label, count]
      properties:
        key:
          type: string
          description: Synonym group key, `|`-joined Dutch keys.
          example: "stil|rustig"
        label: { type: string, example: quiet }
        count: { type: integer, example: 42 }
    SuggestionRequest:
      type: object
      required: [name]
      additionalProperties: false
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 60
          description: Letters/marks plus spaces and - ' . ( ). No digits or angle brackets.
          example: Capybara
        note:
          type: string
          maxLength: 280
          description: Optional reason. No control characters or angle brackets.
    ReportRequest:
      type: object
      required: [reason]
      additionalProperties: false
      properties:
        reason:
          type: string
          enum: [incorrect, unknown, poor_description, other]
        note:
          type: string
          maxLength: 280
    GameReportRequest:
      type: object
      required: [game, reason]
      additionalProperties: false
      properties:
        game:
          type: string
          description: A registered game slug (validated against the registry).
          example: codenames
        reason:
          type: string
          enum: [bug, rules, unclear, other]
        note:
          type: string
          maxLength: 280
    Received:
      type: object
      properties:
        status: { type: string, example: received }
    RoomCreated:
      type: object
      required: [code]
      properties:
        code:
          type: string
          description: The room's join code (pass as `code` to the WebSocket endpoint).
          example: K7QM
    Error:
      type: object
      properties:
        error: { type: string }
